<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詳細 | オンボーディングガイド</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <a class="sidebar-logo" href="index.html">
      <span class="sidebar-logo-icon">📚</span>
      <div>
        <span class="sidebar-logo-title">オンボーディング</span>
        <span class="sidebar-logo-sub">Web制作 基礎ガイド</span>
      </div>
    </a>

    <div class="sidebar-search">
      <span class="sidebar-search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="用語を検索..."
        onkeydown="if(event.key==='Enter' && this.value) location.href='list.html?q='+encodeURIComponent(this.value)">
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">カテゴリ</div>
      <div id="categoryList"></div>
    </nav>

    <div class="sidebar-footer">
      <a class="sidebar-home-btn" href="index.html">← トップへ戻る</a>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main-content">
    <a href="list.html" class="back-btn" id="backBtn">← 一覧に戻る</a>

    <div id="detailContent">
      <div class="empty-state">
        <div style="font-size:48px;margin-bottom:16px">⚠️</div>
        <h3>用語が見つかりません</h3>
        <p><a href="list.html" style="color:var(--primary)">一覧に戻る</a></p>
      </div>
    </div>

    <div class="detail-nav" id="detailNav" style="display:none">
      <a href="#" id="prevBtn" class="detail-nav-btn" style="visibility:hidden">←</a>
      <a href="#" id="nextBtn" class="detail-nav-btn" style="visibility:hidden">→</a>
    </div>
  </main>
</div>

<script src="data.js"></script>
<script>
  const CAT_BG = {
    seo:'#dbeafe', server:'#d1fae5', design:'#ede9fe',
    tool:'#fef3c7', biz:'#fee2e2', structure:'#cffafe',
  };

  /* ── サイドバー */
  function renderSidebar(activeCat) {
    const counts = {};
    TERMS.forEach(t => { counts[t.category] = (counts[t.category] || 0) + 1; });
    document.getElementById('categoryList').innerHTML = CATEGORIES.map(cat => {
      const isActive = cat.id === activeCat;
      const count    = cat.id === 'all' ? TERMS.length : (counts[cat.id] || 0);
      const style    = isActive ? `style="background:${cat.color}"` : '';
      return `
        <div class="nav-item ${isActive ? 'active' : ''}" ${style}
             onclick="location.href='list.html?category=${cat.id}'">
          <span class="nav-item-icon">${cat.icon}</span>
          <span class="nav-item-label">${cat.label}</span>
          <span class="nav-item-count">${count}</span>
        </div>`;
    }).join('');
  }

  /* ── 詳細コンテンツ */
  function renderDetail(id) {
    const term = TERMS.find(t => t.id === id);
    if (!term) { renderSidebar('all'); return; }

    document.title = term.title + ' | オンボーディングガイド';

    const cat = CATEGORIES.find(c => c.id === term.category);
    const bg  = CAT_BG[term.category] || '#f1f5f9';

    document.getElementById('detailContent').innerHTML = `
      <div class="detail-header">
        <span class="card-category-tag tag-${term.category}" style="font-size:12px;padding:4px 14px">
          ${cat ? cat.icon + ' ' + cat.label : ''}
        </span>
        <h1>${term.title}</h1>
        <p class="detail-sub">${term.shortDesc}</p>
        <div class="card-tags" style="margin-top:10px">
          ${term.tags.map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
      </div>
      <div class="detail-body">${term.content}</div>
    `;

    /* 戻るリンクにカテゴリを付与 */
    document.getElementById('backBtn').href = 'list.html?category=' + term.category;

    renderSidebar(term.category);

    /* 前後ナビ */
    const sameCat = TERMS.filter(t => t.category === term.category);
    const idx     = sameCat.findIndex(t => t.id === id);
    const nav     = document.getElementById('detailNav');
    nav.style.display = 'flex';
    const prev = document.getElementById('prevBtn');
    const next = document.getElementById('nextBtn');
    if (idx > 0) {
      prev.href = 'detail.html?id=' + sameCat[idx-1].id;
      prev.textContent = '← ' + sameCat[idx-1].title;
      prev.style.visibility = 'visible';
    }
    if (idx < sameCat.length - 1) {
      next.href = 'detail.html?id=' + sameCat[idx+1].id;
      next.textContent = sameCat[idx+1].title + ' →';
      next.style.visibility = 'visible';
    }
  }

  const params = new URLSearchParams(location.search);
  renderDetail(params.get('id'));
</script>
</body>
</html>
