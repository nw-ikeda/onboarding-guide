<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web制作 オンボーディングガイド</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== HERO ===== -->
<header class="top-hero">
  <div class="top-hero-badge">New Member Guide</div>
  <h1>Web制作<br><span>オンボーディングガイド</span></h1>
  <p class="top-hero-sub">現場で使われる用語・概念・ツールを<br>カテゴリ別にわかりやすくまとめました</p>
  <div class="top-search-wrap">
    <input type="text" id="heroSearch" placeholder="🔍  用語を検索（例: DNS, SEO, ワイヤーフレーム）"
      onkeydown="if(event.key==='Enter')doSearch()">
    <button class="top-search-btn" onclick="doSearch()">検索する</button>
  </div>
</header>

<!-- ===== STATS ===== -->
<div class="top-stats" id="statsBar">
  <!-- JS で描画 -->
</div>

<!-- ===== MAIN ===== -->
<main class="top-main">

  <!-- カテゴリ一覧 -->
  <div>
    <h2 class="top-section-title">📂 カテゴリから探す</h2>
    <p class="top-section-sub">気になるカテゴリをクリックすると、その分野の用語一覧が開きます</p>
    <div class="cat-grid" id="catGrid"><!-- JS --></div>
  </div>

  <!-- 新着・追加用語 -->
  <div class="top-recent">
    <h2 class="top-section-title">🆕 最近追加された用語</h2>
    <p class="top-section-sub">ドキュメントv2から追加された用語</p>
    <div class="recent-grid" id="recentGrid"><!-- JS --></div>
  </div>

</main>

<!-- ===== FOOTER ===== -->
<footer class="top-footer">
  <p>Web制作 オンボーディングガイド &nbsp;|&nbsp;
    <a href="list.html">用語一覧</a> &nbsp;|&nbsp;
    <a href="https://github.com/nw-ikeda/onboarding-guide" target="_blank">GitHub</a>
  </p>
</footer>

<script src="data.js"></script>
<script>
  /* ── カテゴリの補足説明 */
  const CAT_DESCS = {
    seo:       'SEO・AIO・GEO・AEO・E-E-A-T・CWV・カノニカル・被リンク など',
    server:    'DNS・ドメイン・サーバー種類・SSL・サーバー移行・API など',
    design:    'レイアウト・WF・デザインカンプ・VI設計・余白・視覚階層 など',
    tool:      'WordPress・CRM・Markdown・API・リポジトリ・PHP など',
    biz:       'PM/Dir/AD・契約書フロー・PL/CF・インバウンドマーケ など',
    structure: 'サイトマップ3種・WF作成7ステップ・機能/非機能要件 など',
  };

  /* ── カテゴリアイコン背景色 */
  const CAT_BG = {
    seo: '#dbeafe', server: '#d1fae5', design: '#ede9fe',
    tool: '#fef3c7', biz: '#fee2e2', structure: '#cffafe',
  };

  /* ── 最近追加した用語 ID (docx v2 から追加) */
  const RECENT_IDS = [
    'dr','rich-results','responsive','functional-req',
    'chaos-map','server-migration','api','dns-advanced',
    'repository','contract-flow'
  ];

  /* ── Stats */
  function renderStats() {
    const total = TERMS.length;
    const cats  = CATEGORIES.filter(c => c.id !== 'all').length;
    document.getElementById('statsBar').innerHTML = `
      <div class="top-stat-item">
        <div class="top-stat-num">${total}</div>
        <div class="top-stat-label">収録用語数</div>
      </div>
      <div class="top-stat-item">
        <div class="top-stat-num">${cats}</div>
        <div class="top-stat-label">カテゴリ数</div>
      </div>
      <div class="top-stat-item">
        <div class="top-stat-num">+${RECENT_IDS.length}</div>
        <div class="top-stat-label">今回追加</div>
      </div>`;
  }

  /* ── Category Cards */
  function renderCatGrid() {
    const cats = CATEGORIES.filter(c => c.id !== 'all');
    document.getElementById('catGrid').innerHTML = cats.map(cat => {
      const count = TERMS.filter(t => t.category === cat.id).length;
      const bg    = CAT_BG[cat.id] || '#f1f5f9';
      return `
        <a class="cat-card" href="list.html?category=${cat.id}">
          <div class="cat-card-top">
            <div class="cat-icon-wrap" style="background:${bg}">${cat.icon}</div>
            <span class="cat-card-count">${count}件</span>
          </div>
          <div class="cat-card-body">
            <div class="cat-card-title">${cat.label}</div>
            <div class="cat-card-desc">${CAT_DESCS[cat.id] || ''}</div>
          </div>
          <div class="cat-card-footer">
            <span class="cat-card-link">一覧を見る →</span>
          </div>
        </a>`;
    }).join('');
  }

  /* ── Recent Terms */
  function renderRecent() {
    const items = RECENT_IDS
      .map(id => TERMS.find(t => t.id === id))
      .filter(Boolean);
    document.getElementById('recentGrid').innerHTML = items.map(term => {
      const cat = CATEGORIES.find(c => c.id === term.category);
      const bg  = CAT_BG[term.category] || '#f1f5f9';
      return `
        <a class="recent-item" href="detail.html?id=${term.id}">
          <div class="recent-item-icon" style="background:${bg}">${cat ? cat.icon : '📄'}</div>
          <div class="recent-item-body">
            <div class="recent-item-title">${term.title}</div>
            <div class="recent-item-desc">${term.shortDesc}</div>
          </div>
          <span class="recent-item-arrow">›</span>
        </a>`;
    }).join('');
  }

  /* ── Search */
  function doSearch() {
    const q = document.getElementById('heroSearch').value.trim();
    if (q) location.href = 'list.html?q=' + encodeURIComponent(q);
    else   location.href = 'list.html';
  }

  /* ── Init */
  renderStats();
  renderCatGrid();
  renderRecent();
</script>
</body>
</html>
