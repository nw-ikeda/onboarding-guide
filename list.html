<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用語一覧 | オンボーディングガイド</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <a class="sidebar-logo" href="index.html">
      <span class="sidebar-logo-icon">📚</span>
      <div>
        <span class="sidebar-logo-title">オンボーディング</span>
        <span class="sidebar-logo-sub">Web制作 基礎ガイド</span>
      </div>
    </a>

    <div class="sidebar-search">
      <span class="sidebar-search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="用語を検索..."
        oninput="handleSearch(this.value)">
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">カテゴリ</div>
      <div id="categoryList"></div>
    </nav>

    <div class="sidebar-footer">
      <a class="sidebar-home-btn" href="index.html">← トップへ戻る</a>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main-content">
    <div class="content-header">
      <div class="content-header-left">
        <h1 id="pageTitle">すべての用語</h1>
        <div class="meta">
          <span id="termCount" class="count-badge">0件</span>
          <span id="searchLabel" class="search-label" style="display:none"></span>
        </div>
      </div>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <div style="font-size:48px;margin-bottom:16px">🔍</div>
      <h3>該当する用語が見つかりません</h3>
      <p>別のキーワードで検索してみてください</p>
    </div>
  </main>
</div>

<script src="data.js"></script>
<script>
  let currentCategory = 'all';
  let currentSearch   = '';

  /* ── URL パラメータを読む */
  const params = new URLSearchParams(location.search);
  if (params.get('category')) currentCategory = params.get('category');
  if (params.get('q'))        currentSearch   = params.get('q');

  /* ── カテゴリ描画 */
  function renderCategories() {
    const counts = {};
    TERMS.forEach(t => { counts[t.category] = (counts[t.category] || 0) + 1; });

    document.getElementById('categoryList').innerHTML = CATEGORIES.map(cat => {
      const isActive = cat.id === currentCategory;
      const count    = cat.id === 'all' ? TERMS.length : (counts[cat.id] || 0);
      const style    = isActive ? `style="background:${cat.color}"` : '';
      return `
        <div class="nav-item ${isActive ? 'active' : ''}" ${style}
             onclick="selectCategory('${cat.id}')">
          <span class="nav-item-icon">${cat.icon}</span>
          <span class="nav-item-label">${cat.label}</span>
          <span class="nav-item-count">${count}</span>
        </div>`;
    }).join('');
  }

  /* ── カード描画 */
  function renderCards() {
    const q = currentSearch.toLowerCase();
    const filtered = TERMS.filter(t => {
      const matchCat = currentCategory === 'all' || t.category === currentCategory;
      const matchQ   = !q
        || t.title.toLowerCase().includes(q)
        || t.shortDesc.toLowerCase().includes(q)
        || t.tags.some(tag => tag.toLowerCase().includes(q));
      return matchCat && matchQ;
    });

    const grid  = document.getElementById('cardsGrid');
    const empty = document.getElementById('emptyState');
    document.getElementById('termCount').textContent = filtered.length + '件';

    if (filtered.length === 0) {
      grid.style.display = 'none'; empty.style.display = 'block'; return;
    }
    grid.style.display = 'grid'; empty.style.display = 'none';

    grid.innerHTML = filtered.map(term => {
      const cat = CATEGORIES.find(c => c.id === term.category);
      return `
        <div class="term-card" onclick="location.href='detail.html?id=${term.id}'">
          <span class="card-category-tag tag-${term.category}">
            ${cat ? cat.icon + ' ' + cat.label : ''}
          </span>
          <div class="card-title">${hl(term.title, q)}</div>
          <div class="card-desc">${hl(term.shortDesc, q)}</div>
          <div class="card-tags">
            ${term.tags.slice(0,4).map(t => `<span class="tag">${t}</span>`).join('')}
          </div>
          <div class="card-footer">
            <span class="card-link">詳細を見る →</span>
          </div>
        </div>`;
    }).join('');
  }

  /* ── タイトル更新 */
  function updateTitle() {
    const cat = CATEGORIES.find(c => c.id === currentCategory);
    document.getElementById('pageTitle').textContent =
      currentCategory === 'all' ? 'すべての用語' : cat.label;
    const lbl = document.getElementById('searchLabel');
    if (currentSearch) {
      lbl.style.display = 'inline';
      lbl.textContent = '「' + currentSearch + '」で検索中';
    } else {
      lbl.style.display = 'none';
    }
  }

  function selectCategory(id) {
    currentCategory = id; currentSearch = '';
    document.getElementById('searchInput').value = '';
    history.replaceState(null, '', id === 'all' ? 'list.html' : 'list.html?category=' + id);
    updateTitle(); renderCategories(); renderCards();
  }

  function handleSearch(val) {
    currentSearch = val; updateTitle(); renderCards();
  }

  function hl(text, q) {
    if (!q) return text;
    return text.replace(
      new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'),
      '<mark>$1</mark>'
    );
  }

  /* ── 初期描画 */
  if (currentSearch) document.getElementById('searchInput').value = currentSearch;
  updateTitle(); renderCategories(); renderCards();
</script>
</body>
</html>
